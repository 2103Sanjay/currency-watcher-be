# CI/CD for the Currency Watcher API.
#
#   test ──► build ──► [manual approval] ──► deploy
#
# - Pull requests run test + build only.
# - Pushes to main (or a manual run) also deploy, but the deploy job targets
#   the "production" environment, which requires a reviewer to approve it
#   (configured in Settings → Environments → production → Required reviewers).
# - The image deployed is the exact artifact built and smoke-tested in CI.
# - AWS access uses GitHub OIDC to assume an IAM role: no AWS keys are stored.
#
# Repository variables used by the deploy job (Settings → Secrets and
# variables → Actions → Variables), all printed by `terraform output`:
#   AWS_REGION, AWS_ROLE_ARN, ECR_REPOSITORY, EC2_INSTANCE_ID, API_URL

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: currency-watcher
  # Must match the EC2 instance architecture (linux/arm64 for Graviton types).
  PLATFORM: linux/amd64

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test (with race detector)
        run: go test -race -count=1 -coverpkg=./internal/... -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: |
          total="$(go tool cover -func=coverage.out | tail -1 | awk '{print $NF}')"
          echo "### Test coverage: ${total}" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ env.PLATFORM }}
          build-args: VERSION=${{ github.sha }}
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container
        run: |
          docker load --input "${{ runner.temp }}/image.tar"
          docker run -d --name smoke -p 8080:8080 "${IMAGE_NAME}:${GITHUB_SHA}"
          for _ in $(seq 1 20); do
            if body="$(curl -fsS http://localhost:8080/api/health)"; then break; fi
            sleep 1
          done
          echo "health: ${body:-<no response>}"
          docker logs smoke
          echo "$body" | grep -q "\"version\":\"${GITHUB_SHA}\"" || {
            echo "::error::Container did not report the expected version"
            exit 1
          }
          docker rm -f smoke

      - name: Upload image artifact
        uses: actions/upload-artifact@v7
        with:
          name: image
          path: ${{ runner.temp }}/image.tar
          retention-days: 7

  deploy:
    name: Deploy to EC2
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # Required reviewers on this environment make the job wait for approval.
    environment:
      name: production
      url: ${{ vars.API_URL }}
    # Never run two deployments at once; queue instead of cancelling.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # to request the OIDC token for AWS
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: image
          path: ${{ runner.temp }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push image to ECR
        id: push
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: |
          docker load --input "${{ runner.temp }}/image.tar"
          image="${REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"
          docker tag "${IMAGE_NAME}:${GITHUB_SHA}" "$image"
          docker push "$image"
          # "latest" lets a newly created instance start the current release on boot.
          docker tag "${IMAGE_NAME}:${GITHUB_SHA}" "${REGISTRY}/${ECR_REPOSITORY}:latest"
          docker push "${REGISTRY}/${ECR_REPOSITORY}:latest"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Deploy via SSM Run Command
        env:
          IMAGE: ${{ steps.push.outputs.image }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          # Ship scripts/deploy.sh base64-encoded so no quoting can break it.
          script_b64="$(base64 -w0 scripts/deploy.sh)"
          command="echo ${script_b64} | base64 -d > /tmp/cw-deploy.sh && IMAGE='${IMAGE}' AWS_REGION='${AWS_REGION}' bash /tmp/cw-deploy.sh"

          command_id="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy ${GITHUB_SHA::7}" \
            --timeout-seconds 600 \
            --parameters "$(jq -n --arg c "$command" '{commands: [$c]}')" \
            --query Command.CommandId --output text)"
          echo "SSM command: $command_id"

          status=Pending
          for _ in $(seq 1 120); do
            sleep 5
            status="$(aws ssm get-command-invocation \
              --command-id "$command_id" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)"
            case "$status" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
          done

          echo "::group::Instance output"
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text
          echo "::endgroup::"

          if [ "$status" != "Success" ]; then
            echo "::error::Deployment finished with status: $status"
            exit 1
          fi

      - name: Verify public endpoint
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          for _ in $(seq 1 12); do
            if body="$(curl -fsS --max-time 5 "${API_URL}/api/health")" \
               && echo "$body" | grep -q "\"version\":\"${GITHUB_SHA}\""; then
              echo "health: $body"
              curl -fsS --max-time 10 "${API_URL}/api/rates?base=USD&targets=EUR"
              echo
              echo "### Deployed \`${GITHUB_SHA::7}\` to ${API_URL}" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo "::error::${API_URL} is not serving version ${GITHUB_SHA}"
          exit 1
